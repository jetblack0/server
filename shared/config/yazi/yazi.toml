# File list
# ---------------------------------------------
[mgr]
ratio          = [ 1, 4, 3 ]           # parent : current : preview
sort_by        = "mtime"
sort_reverse   = true                  # newest first
sort_dir_first = true
# ---------------------------------------------


# Preview
# ---------------------------------------------
[preview]
image_quality = 70                     # 50-90, lower is faster to decode
# ---------------------------------------------


# Openers
# ---------------------------------------------
[opener]
edit = [
	{ run = 'nvim %s', block = true, for = "unix" },
]
# ---------------------------------------------


# Open rules
# ---------------------------------------------
[open]
prepend_rules = [
	{ mime = "text/*",                 use = "edit" },
	{ mime = "application/json",       use = "edit" },
	{ mime = "application/javascript", use = "edit" },
]
append_rules = [
	{ url = "*", use = "edit" },
]
# ---------------------------------------------


# Previewers
# ---------------------------------------------
[plugin]
prepend_previewers = [
	{ mime = "text/*", run = 'piper -- bat --color=always --style=numbers --paging=never "$1"' },

	# Archive contents as a tree. Needs `ouch` on PATH and the ouch.yazi
	# plugin, both of which the playbook installs.
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
]
# ---------------------------------------------
