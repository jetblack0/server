---
# Push mode targets. The other two models never read this file: they name the
# box inline instead, with `-i localhost,`.
#
# Nothing is declared by default, so a push run that forgets -l matches no
# hosts instead of reaching for every server at once.
all:
  children:
    servers:
      hosts: {}
        # box.example.com:
        #   ansible_user: ec2-user
