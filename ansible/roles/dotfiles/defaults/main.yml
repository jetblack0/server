---
# The users to install for. Take a list, so one run can serve several accounts:
#   -e '{"dotfiles_users": ["root", "ec2-user"]}'
dotfiles_users: ["{{ ansible_facts['user_id'] }}"]

# Make zsh the login shell of every user above.
dotfiles_login_shell: false

# The configs, shared with every other framework in the repo. Resolved
# relative to the playbook so that push, local and pull runs all find it.
dotfiles_shared: "{{ playbook_dir | dirname }}/shared"

# Every directory under shared/config is installed into ~/.config as one
# unit, except the ones masked for this distro. The key is the distribution
# name and its major version, the same names the lab uses.
dotfiles_mask: {}

# Files under shared/home, relative to the user's home.
dotfiles_home_files:
  - { src: zshenv, dest: .zshenv }

dotfiles_state_dirs:
  - .cache/less
  - .cache/zsh
  - .local/share/zsh
  - .local/state

# Where a directory about to be overwritten is snapshotted first, relative to
# the user's home, one folder per playbook run.
dotfiles_backup: ".local/state/dotfiles/backup/{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
