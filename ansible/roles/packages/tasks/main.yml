---
- name: Fail on an unsupported package manager
  ansible.builtin.fail:
    msg: >-
      Unsupported package manager '{{ ansible_facts['pkg_mgr'] }}' on
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
  when: packages_manager | length == 0

- name: Install the base packages
  ansible.builtin.include_tasks: "{{ packages_manager }}.yml"

- name: Give every login a UTF-8 locale
  ansible.builtin.include_tasks: locale.yml

- name: Fill in the terminal descriptions the distro leaves out
  ansible.builtin.include_tasks: terminfo.yml
