---
# The sources the config template knows how to render. main.yml rejects
# anything else by name.
alloy_known_metrics: [node, docker]
alloy_known_logs: [docker, journal]

# Everything an alloy_metrics_extra entry may carry; main.yml rejects
# unknown keys so a typo'd option fails instead of being ignored.
alloy_extra_keys: [job, address, path, scheme, insecure, username, password]

# Both docker sources need the daemon socket, and the unit ordering.
alloy_wants_docker: "{{ 'docker' in alloy_metrics or 'docker' in alloy_logs }}"

# Engine-level container state rides the node exporter's textfile
# collector, so wanting it keeps that pipeline alive (textfile-only) even
# on a box without node metrics.
alloy_wants_docker_state: "{{ 'docker' in alloy_metrics and alloy_docker_state | bool }}"

# Metrics come from the built-in sources or the caller's own endpoints;
# either one makes the remote-write half of the config real.
alloy_wants_metrics: "{{ alloy_metrics | length > 0 or alloy_metrics_extra | length > 0 }}"

# Grafana publishes more architectures than these; add a mapping when a box
# actually needs one.
alloy_arch_map:
  x86_64: amd64
  aarch64: arm64
alloy_arch: "{{ alloy_arch_map[ansible_facts['architecture']] }}"
