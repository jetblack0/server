---
# What to collect. Both lists default to empty:
#   metrics: node     host metrics (the node-exporter set, plus a textfile
#                     directory at /var/lib/alloy/textfile for your own)
#            docker   per-container cpu/memory/network/disk/oom, via the
#                     embedded cadvisor
#   logs:    docker   container stdout/stderr
#            journal  the systemd journal
# ---------------------------------------------
alloy_metrics: []
alloy_logs: []

# Prometheus endpoints scrape alongside:
#   alloy_metrics_extra:
#     - { job: dcgm-exporter, address: "127.0.0.1:9400" }
#     - { job: my-app, address: "127.0.0.1:8080", path: /internal/metrics }
#
# job and address are required; path defaults to /metrics.
# ---------------------------------------------
alloy_metrics_extra: []

# Where it goes. Each URL is required as soon as the matching list above
# names a source.
# ---------------------------------------------
alloy_prometheus_url: "" # e.g. https://prometheus.example.com/api/v1/write
alloy_loki_url: ""       # e.g. https://loki.example.com/loki/api/v1/push

# Credentials for those endpoints (basic auth), and the loki tenant. Empty
# means the block is left out of the config entirely.
# ---------------------------------------------
alloy_prometheus_username: ""
alloy_prometheus_password: ""
alloy_loki_username: ""
alloy_loki_password: ""
alloy_loki_tenant_id: ""

# Stamped on every metric and log line this box exports.
# ---------------------------------------------
alloy_labels: {}

# With docker metrics, a bundled script + 30s timer also export engine-level
# container state (restart count, one-hot state/health, started-at) under
# job=docker-state.
# ---------------------------------------------
alloy_docker_state: true

alloy_version: "1.18.1"
alloy_http_port: 12345
alloy_journal_max_age: "12h"
