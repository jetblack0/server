# Makes this folder an Ansible collection, jetblack0.server.
# In that repo's requirements.yml:
#
#   collections:
#     - name: git+https://github.com/jetblack0/server.git#/ansible/
#       version: v1.0.0   # a tag here
#
# then `ansible-galaxy collection install -r requirements.yml`, and use a
# role by its full name, e.g. jetblack0.server.alloy.
#
# Bump version and tag a release (vX.Y.Z) when a role changes.
---
namespace: jetblack0
name: server
version: 1.0.0
readme: README.md
authors:
  - Kaicheng Qi
description: Roles that set up a standalone server (telemetry, dotfiles, tools).
license:
  - MIT
repository: https://github.com/jetblack0/server

# Only the roles are the collection; the rest is for running this repo's own
# playbooks.
build_ignore:
  - .ansible
  - ansible.cfg
  - inventory
  - group_vars
  - lab
  - examples
  - "*.retry"
  - "**/__pycache__"
