source ~/.config/tmux/themes/gruvbox/base16-gruvbox-dark-hard.conf
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-kitty:Tc"
set -as terminal-features ',xterm-256color:clipboard'
set-option -g default-shell /usr/bin/zsh

set -s set-clipboard on
# set -g allow-passthrough on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# toggle status bar
bind b set-option -g status
bind r source-file ~/.config/tmux/tmux.conf

# avoid ESC delay
set -s escape-time 1
set -g base-index 1
setw -g pane-base-index 1

# mouse works as expected
# set -g mouse on

setw -g monitor-activity on
set -g visual-activity off

set -g mode-keys vi
set -g history-limit 10000

# clean screen
# bind C-l send-keys 'C-l'

# y and p as in vim
bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
# to the privous and next prompt
# bind -T copy-mode-vi , send-keys -X next-prompt
# bind -T copy-mode-vi < send-keys -X previous-prompt
bind-key -T copy-mode-vi '.' send -X search-forward ".root@ip-10-56-69-118 "
bind-key -T copy-mode-vi ',' send -X search-backward ".root@ip-10-56-69-118 "
# bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# better way to split pane and open them in the same directory (it will follow link, doesn't matter)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# moving between panes with vim movement keys (handled by vim-tmux-navigator)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# moving between window
bind N prev
# bind -n S-left prev
# bind -n S-right next
# unbind l

# resize panes with vim movement keys
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Send commands to all panels, useful for managing server clusters. 
bind y setw synchronize-panes on \; display-message "Sync ON"
bind Y setw synchronize-panes off \; display-message "Sync OFF"

# color scheme
# set -g @tmux_power_theme 'snow'
# run-shell "/home/jetblack/.config/tmux/colorScheme/powerline/tmux-power.tmux"

# yank into system clipboard
# run-shell ~/.config/tmux/plugin/tmux-yank/yank.tmux

bind-key s display-popup -d '#{pane_current_path}' -w 60% -h 60% -E "$SHELL"


# run-shell ~/.config/tmux/plugin/tmux-yank/yank.tmux
