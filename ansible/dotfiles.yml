# push    ansible-playbook -i inventory/lab dotfiles.yml -l <host>
# local   ansible-playbook -i localhost, -c local dotfiles.yml
# pull    ansible-pull -U <repo> -i localhost, ansible/dotfiles.yml

---
- name: Install personal CLI tooling and shell setup
  hosts: all

  become: false
  gather_facts: true

  roles:
    - { role: packages, tags: packages }
    - { role: binaries, tags: binaries }
    - { role: dotfiles, tags: dotfiles }
